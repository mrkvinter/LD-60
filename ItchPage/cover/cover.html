<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Last Overtime — cover</title>
<style>
  /* itch.io cover: 630x500 (rendered at 2x) */
  @font-face { font-family: "Saira Stencil One"; font-weight: 400;
    src: url(https://fonts.gstatic.com/s/sairastencilone/v19/SLXSc03I6HkvZGJ1GvvipLoYSTEL9DsLYQk.woff2) format("woff2"); }

  html, body { margin: 0; width: 630px; height: 500px; overflow: hidden; background: #0d0b08; }

  .cover { position: relative; width: 630px; height: 500px; overflow: hidden; }

  /* the portal screenshot, framed on the portal */
  .shot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 100% 30%;
  }

  /* dark at the bottom for the title, dark corners */
  .shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 38%, rgba(8, 6, 3, .75) 68%, rgba(8, 6, 3, .95) 100%),
      radial-gradient(ellipse 85% 75% at 50% 35%, transparent 55%, rgba(0, 0, 0, .55) 100%);
  }

  .title {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 46px;
    margin: 0;
    text-align: center;
    font-family: "Saira Stencil One", Impact, sans-serif;
    font-weight: 400;
    font-size: 74px;
    line-height: .92;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: #ffd21a;
    text-shadow: 0 5px 0 #000, 0 0 30px rgba(255, 210, 26, .45);
  }

  .hazard {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16px;
    background: repeating-linear-gradient(-45deg, #ffd21a 0 12px, #0d0b08 12px 24px);
    border-top: 2px solid #000;
  }
</style>
</head>
<body>
  <div class="cover">
    <img class="shot" src="../screenshots/01-portal.png" alt="">
    <div class="shade"></div>
    <h1 class="title">The Last<br>Overtime</h1>
    <div class="hazard"></div>
  </div>
</body>
</html>
